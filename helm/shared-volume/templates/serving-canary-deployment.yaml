apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-serving-canary
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.serving.canaryReplicas }}
  selector:
    matchLabels:
      app: mlops-serving-canary
  template:
    metadata:
      labels:
        app: mlops-serving-canary
    spec:
      initContainers:
        - name: sync-repo
          image: {{ .Values.images.sync }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              while IFS== read -r key path; do
                path="${path//$'\r'/}"
                mkdir -p /shared/$(dirname "$path")
                cp /repo/$key /shared/$path
              done < /repo/manifest
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: repo
              mountPath: /repo
      containers:
        - name: serving
          image: {{ .Values.images.serving }}
          imagePullPolicy: {{ .Values.images.servingPullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              python /shared/apps/serving/app.py
          env:
            - name: MLFLOW_TRACKING_URI
              value: sqlite:////shared/mlflow/mlflow.db
            - name: SERVING_PORT
              value: "{{ .Values.serving.port }}"
            - name: PYTHONPATH
              value: /shared
            - name: MODEL_STAGE
              value: "{{ .Values.serving.canaryModelStage }}"
          ports:
            - containerPort: {{ .Values.serving.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.serving.port }}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.serving.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.serving.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
{{- if .Values.sharedVolume.useHostPath }}
          hostPath:
            path: {{ .Values.sharedVolume.hostPath }}
            type: DirectoryOrCreate
{{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
{{- end }}
        - name: repo
          configMap:
            name: mlops-app-repo

apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    app: mlops-ingest
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  selector:
    matchLabels:
      app: mlops-ingest
  template:
    metadata:
      labels:
        app: mlops-ingest
    spec:
      initContainers:
        - name: sync-repo
          image: {{ .Values.images.sync }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              while IFS== read -r key path; do
                mkdir -p /shared/$(dirname "$path")
                cp /repo/$key /shared/$path
              done < /repo/manifest
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: repo
              mountPath: /repo
      containers:
        - name: ingest
          image: {{ .Values.images.python }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir pandas deltalake pyarrow prometheus-client && cd /shared && python /shared/apps/ingestion/ingest.py
          volumeMounts:
            - name: shared
              mountPath: /shared
          env:
            - name: PYTHONPATH
              value: /shared
            - name: PUSHGATEWAY_URL
              value: http://mlops-pushgateway:{{ .Values.pushgateway.port }}
      restartPolicy: Never
      volumes:
        - name: shared
{{- if .Values.sharedVolume.useHostPath }}
          hostPath:
            path: {{ .Values.sharedVolume.hostPath }}
            type: DirectoryOrCreate
{{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
{{- end }}
        - name: repo
          configMap:
            name: mlops-app-repo
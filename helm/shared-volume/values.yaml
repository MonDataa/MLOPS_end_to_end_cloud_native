pvc:
  name: mlops-shared-volume
  size: 10Gi
  accessModes:
    - ReadWriteMany
  storageClass: ''

sharedVolume:
  useHostPath: false
  hostPath:

images:
  redis: redis:7-alpine
  python: python:3.11-slim
  training: mlops-training:latest
  trainingPullPolicy: IfNotPresent
  serving: mlops-serving:latest
  servingPullPolicy: IfNotPresent
  prometheus: prom/prometheus:v2.50.0
  pushgateway: prom/pushgateway:v1.8.0
  grafana: grafana/grafana:10.1.4
  sync: busybox:1.36.1

resources: {}
serving:
  replicas: 1
  port: 8080
  canaryReplicas: 1
  canaryModelStage: Production
prometheus:
  replicas: 1
  port: 9090
pushgateway:
  replicas: 1
  port: 9091
grafana:
  replicas: 1
  port: 3000
drift:
  schedule: "*/30 * * * *"
  psiThreshold: 0.2
  autoRetrainOnDrift: true
  sampleSize: 500
trainingCron:
  schedule: "0 2 * * *"
